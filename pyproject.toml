[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-humanizer"
version = "0.1.0"
description = "A CLI tool to detect and humanize AI-generated text in documents (PDF, DOCX, PPTX)."
authors = [{ name = "Vishal Raghav" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "rich>=13.0.0",
    "pymupdf>=1.23.0",
    "httpx>=0.24.0",
    "typer>=0.9.0",
]

[project.scripts]
doc-humanizer = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.handlers"]

